# Validates Terraform configuration before changes can be merged into main.
name: Terraform Checks

on:
  pull_request:
    branches:
      - main

# Provides the minimum permissions required to read repository contents.
permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
      # Pins actions/checkout v4 to an immutable commit and prevents credential persistence.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Pins HashiCorp setup-terraform v3 to an immutable commit.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.1"

      # Checks Terraform formatting without modifying files.
      - name: Terraform Format
        run: terraform fmt -check -recursive ../..

      # Downloads providers and modules without connecting to the production backend.
      - name: Terraform Init
        run: terraform init -backend=false

      # Validates the Terraform configuration for syntax and internal consistency.
      - name: Terraform Validate
        run: terraform validate